<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Time & Jobs">
<meta name="theme-color" content="#1B365D">
<title>Time & Jobs</title>
<style>
  :root {
    --navy: #1B365D;
    --navy2: #152A47;
    --teal: #0F6B6B;
    --cream: #F7F3EA;
    --off: #FBF9F4;
    --ink: #1F2937;
    --mute: #64748B;
    --line: #E5E0D4;
    --gold: #C4A35A;
    --red: #B42318;
    --green: #1B7F5A;
    --orange: #B45309;
    --yellow: #FFF3BF;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--cream); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: 88px; }
  header {
    background: var(--navy); color: #fff; padding: 16px 16px 14px;
    padding-top: max(16px, env(safe-area-inset-top));
    position: sticky; top: 0; z-index: 20;
  }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .02em; }
  header p { margin: 4px 0 0; font-size: 12px; opacity: .8; }
  .tabs {
    display: flex; gap: 8px; padding: 10px 12px; background: var(--off);
    position: sticky; top: 64px; z-index: 15; border-bottom: 1px solid var(--line);
  }
  .tab {
    flex: 1; border: 0; background: #fff; color: var(--navy); font-weight: 600;
    padding: 10px 8px; border-radius: 10px; font-size: 14px;
  }
  .tab.on { background: var(--navy); color: #fff; }
  main { padding: 14px 14px 24px; max-width: 640px; margin: 0 auto; }
  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; margin-bottom: 12px;
  }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .cat { font-weight: 700; color: var(--navy); }
  .rem { font-size: 22px; font-weight: 800; color: var(--green); }
  .rem.low { color: var(--orange); }
  .rem.out { color: var(--red); }
  .meta { font-size: 12px; color: var(--mute); margin-top: 4px; }
  label { display: block; font-size: 12px; font-weight: 700; color: var(--mute); margin: 10px 0 4px; }
  input, select, textarea {
    width: 100%; font-size: 16px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--yellow); color: var(--ink);
  }
  textarea { min-height: 72px; resize: vertical; }
  .btn {
    display: block; width: 100%; margin-top: 12px; border: 0; border-radius: 12px;
    padding: 13px; font-size: 16px; font-weight: 700; color: #fff; background: var(--teal);
  }
  .btn.navy { background: var(--navy); }
  .btn.ghost { background: #fff; color: var(--navy); border: 1px solid var(--line); }
  .btn.danger { background: var(--red); }
  .item { border-bottom: 1px solid var(--line); padding: 12px 0; }
  .item:last-child { border-bottom: 0; }
  .item h3 { margin: 0 0 4px; font-size: 16px; }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; margin-right: 6px; }
  .taken { background: #E6F4EE; color: var(--green); }
  .pending { background: #FEF3C7; color: var(--orange); }
  .open { background: #E8EEF5; color: var(--navy); }
  .done { background: #E6F4EE; color: var(--green); }
  .high { background: #FDECEC; color: var(--red); }
  .hint { font-size: 13px; color: var(--mute); line-height: 1.4; }
  .hidden { display: none; }
  .actions { display: flex; gap: 8px; margin-top: 8px; }
  .actions button { flex: 1; }
</style>
</head>
<body>
<header>
  <h1>Time & Jobs</h1>
  <p>Leave balances and jobs — stays on this phone</p>
</header>
<div class="tabs">
  <button class="tab on" data-tab="home">Home</button>
  <button class="tab" data-tab="leave">Leave</button>
  <button class="tab" data-tab="jobs">Jobs</button>
</div>
<main id="home">
  <div class="card" id="balances"></div>
  <div class="card">
    <div class="row"><strong>Next jobs</strong></div>
    <div id="nextJobs"></div>
  </div>
  <div class="card hint">
    Tap Share → Add to Home Screen. Your leave and jobs stay on this phone.
  </div>
</main>
<main id="leave" class="hidden">
  <div class="card">
    <strong>Starting days</strong>
    <p class="hint">Change these anytime. Used days come from the log below.</p>
    <div id="starts"></div>
    <button class="btn navy" id="saveStarts">Save starting days</button>
  </div>
  <div class="card">
    <strong>Use a day</strong>
    <label>Date</label><input type="date" id="lDate">
    <label>Category</label>
    <select id="lCat"></select>
    <label>Days used</label>
    <select id="lDays">
      <option value="0.5">Half day (0.5)</option>
      <option value="1" selected>Full day (1)</option>
      <option value="2">2 days</option>
      <option value="3">3 days</option>
      <option value="5">5 days</option>
    </select>
    <label>Why / note</label>
    <textarea id="lNote" placeholder="Short reason you used the day"></textarea>
    <label>Status</label>
    <select id="lStatus">
      <option>Taken</option>
      <option>Approved</option>
      <option>Pending</option>
      <option>Denied</option>
    </select>
    <button class="btn" id="addLeave">Add to log — subtract from that category</button>
  </div>
  <div class="card">
    <strong>Leave log</strong>
    <div id="leaveList"></div>
  </div>
</main>
<main id="jobs" class="hidden">
  <div class="card">
    <strong id="jobFormTitle">Add a job</strong>
    <input type="hidden" id="jobId">
    <label>Job / task</label><input id="jTitle" placeholder="What you have to do">
    <label>Location</label><input id="jLoc" placeholder="Where">
    <label>Date</label><input type="date" id="jDate">
    <label>Time</label><input type="time" id="jTime">
    <label>Due by</label><input type="date" id="jDue">
    <label>Note</label><textarea id="jNote" placeholder="Details and by when"></textarea>
    <label>Priority</label>
    <select id="jPri"><option>High</option><option selected>Medium</option><option>Low</option></select>
    <label>Status</label>
    <select id="jStatus"><option>Open</option><option>In progress</option><option>Done</option><option>On hold</option></select>
    <button class="btn" id="saveJob">Save job</button>
    <button class="btn ghost" id="clearJob">Clear form</button>
  </div>
  <div class="card">
    <strong>All jobs</strong>
    <div id="jobList"></div>
  </div>
</main>
<script>
const CATS = ["Vacation","Sick","Family Sick","Non-Contact","Personal Leave"];
const KEY = "timeJobs_v1";
const today = () => new Date().toISOString().slice(0,10);
function load() {
  const raw = localStorage.getItem(KEY);
  if (raw) return JSON.parse(raw);
  return {
    starts: { "Vacation":15, "Sick":10, "Family Sick":5, "Non-Contact":3, "Personal Leave":3 },
    leave: [],
    jobs: []
  };
}
function save(d) { localStorage.setItem(KEY, JSON.stringify(d)); }
let data = load();
function usedOf(cat) {
  return data.leave
    .filter(x => x.cat === cat && x.action !== "Delete" && (x.status === "Taken" || x.status === "Approved"))
    .reduce((s,x)=>s+Number(x.days||0),0);
}
function pendingOf(cat) {
  return data.leave
    .filter(x => x.cat === cat && x.action !== "Delete" && x.status === "Pending")
    .reduce((s,x)=>s+Number(x.days||0),0);
}
function remaining(cat) {
  return Math.max(0, Number(data.starts[cat]||0) - usedOf(cat) - pendingOf(cat));
}
function renderHome() {
  const box = document.getElementById("balances");
  box.innerHTML = "<strong>Available time</strong>" + CATS.map(c => {
    const r = remaining(c);
    const cls = r<=0 ? "out" : (r < Number(data.starts[c]||0)*0.25 ? "low" : "");
    return `<div class="item"><div class="row"><span class="cat">${c}</span><span class="rem ${cls}">${r}</span></div>
      <div class="meta">Start ${data.starts[c]} · Used ${usedOf(c)} · Pending ${pendingOf(c)}</div></div>`;
  }).join("");
  const open = data.jobs.filter(j => j.status==="Open" || j.status==="In progress").slice(0,6);
  document.getElementById("nextJobs").innerHTML = open.length ? open.map(j =>
    `<div class="item"><h3>${esc(j.title)}</h3>
     <div class="meta">${esc(j.loc||"")} · ${j.date||""} ${j.time||""} · due ${j.due||"—"}</div>
     <span class="pill ${j.status==="Done"?"done":"open"}">${j.status}</span>
     ${j.pri==="High"?'<span class="pill high">High</span>':""}
    </div>`).join("") : '<p class="hint">No open jobs yet. Add one on the Jobs tab.</p>';
}
function renderLeave() {
  document.getElementById("starts").innerHTML = CATS.map(c =>
    `<label>${c}</label><input type="number" step="0.5" min="0" data-start="${c}" value="${data.starts[c]}">`
  ).join("");
  const sel = document.getElementById("lCat");
  sel.innerHTML = CATS.map(c=>`<option>${c}</option>`).join("");
  if (!document.getElementById("lDate").value) document.getElementById("lDate").value = today();
  const list = [...data.leave].reverse();
  document.getElementById("leaveList").innerHTML = list.length ? list.map(x =>
    `<div class="item">
      <div class="row"><strong>${esc(x.cat)}</strong><span>${x.days} day${x.days==1?"":"s"}</span></div>
      <div class="meta">${x.date} · ${esc(x.note||"")}</div>
      <span class="pill ${x.status==="Pending"?"pending":"taken"}">${x.status}</span>
      <div class="actions">
        <button class="btn ghost" onclick="delLeave('${x.id}')">Delete</button>
      </div>
    </div>`).join("") : '<p class="hint">No leave logged yet.</p>';
}
function renderJobs() {
  const list = [...data.jobs].reverse();
  document.getElementById("jobList").innerHTML = list.length ? list.map(j =>
    `<div class="item">
      <h3>${esc(j.title)}</h3>
      <div class="meta">${esc(j.loc||"")} · ${j.date||""} ${j.time||""} · due ${j.due||"—"}</div>
      <div class="meta">${esc(j.note||"")}</div>
      <span class="pill ${j.status==="Done"?"done":"open"}">${j.status}</span>
      ${j.pri==="High"?'<span class="pill high">High</span>':`<span class="pill open">${j.pri}</span>`}
      <div class="actions">
        <button class="btn ghost" onclick="editJob('${j.id}')">Edit</button>
        <button class="btn danger" onclick="delJob('${j.id}')">Delete</button>
      </div>
    </div>`).join("") : '<p class="hint">No jobs yet. Fill the form above.</p>';
}
function esc(s){ return String(s||"").replace(/[&<>"']/g, m => ({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[m])); }
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
  t.classList.add("on");
  ["home","leave","jobs"].forEach(id => document.getElementById(id).classList.toggle("hidden", id !== t.dataset.tab));
  refresh();
});
document.getElementById("saveStarts").onclick = () => {
  document.querySelectorAll("[data-start]").forEach(el => data.starts[el.dataset.start] = Number(el.value||0));
  save(data); refresh();
};
document.getElementById("addLeave").onclick = () => {
  const cat = document.getElementById("lCat").value;
  const days = Number(document.getElementById("lDays").value);
  const note = document.getElementById("lNote").value.trim();
  if (!note) { alert("Add a short note why you used the day."); return; }
  data.leave.push({
    id: String(Date.now()),
    date: document.getElementById("lDate").value || today(),
    cat, days, note,
    status: document.getElementById("lStatus").value,
    action: "Keep"
  });
  document.getElementById("lNote").value = "";
  save(data); refresh();
};
window.delLeave = (id) => {
  data.leave = data.leave.filter(x => x.id !== id);
  save(data); refresh();
};
document.getElementById("saveJob").onclick = () => {
  const title = document.getElementById("jTitle").value.trim();
  if (!title) { alert("Write the job you have to do."); return; }
  const row = {
    id: document.getElementById("jobId").value || String(Date.now()),
    title,
    loc: document.getElementById("jLoc").value.trim(),
    date: document.getElementById("jDate").value,
    time: document.getElementById("jTime").value,
    due: document.getElementById("jDue").value,
    note: document.getElementById("jNote").value.trim(),
    pri: document.getElementById("jPri").value,
    status: document.getElementById("jStatus").value
  };
  const i = data.jobs.findIndex(j => j.id === row.id);
  if (i >= 0) data.jobs[i] = row; else data.jobs.push(row);
  save(data); clearJob(); refresh();
};
function clearJob() {
  ["jobId","jTitle","jLoc","jDate","jTime","jDue","jNote"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("jobFormTitle").textContent = "Add a job";
}
document.getElementById("clearJob").onclick = clearJob;
window.editJob = (id) => {
  const j = data.jobs.find(x => x.id === id); if (!j) return;
  document.getElementById("jobId").value = j.id;
  document.getElementById("jTitle").value = j.title;
  document.getElementById("jLoc").value = j.loc || "";
  document.getElementById("jDate").value = j.date || "";
  document.getElementById("jTime").value = j.time || "";
  document.getElementById("jDue").value = j.due || "";
  document.getElementById("jNote").value = j.note || "";
  document.getElementById("jPri").value = j.pri;
  document.getElementById("jStatus").value = j.status;
  document.getElementById("jobFormTitle").textContent = "Edit job";
  window.scrollTo({ top: 0, behavior: "smooth" });
};
window.delJob = (id) => {
  if (!confirm("Delete this job?")) return;
  data.jobs = data.jobs.filter(j => j.id !== id);
  save(data); refresh();
};
function refresh(){ renderHome(); renderLeave(); renderJobs(); }
refresh();
</script>
</body>
</html>
